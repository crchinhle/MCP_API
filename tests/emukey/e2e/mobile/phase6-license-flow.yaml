appId: app.emukey.mobile
name: Phase 6 real backend and blockchain flow
env:
  CUSTOMER_EMAIL: ${E2E_CUSTOMER_EMAIL}
  CUSTOMER_PASSWORD: ${E2E_CUSTOMER_PASSWORD}
---
- launchApp:
    clearState: true
- tapOn: Email
- inputText: ${CUSTOMER_EMAIL}
- tapOn: Mật khẩu
- inputText: ${CUSTOMER_PASSWORD}
- tapOn: Đăng nhập
- tapOn: Tài khoản
- tapOn: Bản quyền của tôi
- assertVisible: Bản quyền của tôi
- assertVisible: ".*Đang hoạt động.*|.*ACTIVE.*"
- tapOn: ".*EMU-.*"
- tapOn: ".*Quản lý thiết bị.*"
- extendedWaitUntil:
    visible: ".*Đang hoạt động.*|.*ACTIVE.*"
    timeout: 30000

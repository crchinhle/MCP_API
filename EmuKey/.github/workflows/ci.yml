name: CI

on:
  pull_request:
  push:
    branches: [main, ChinhLe]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Pre-pull integration test images
        shell: bash
        timeout-minutes: 10
        run: |
          # Testcontainers reuses local images. Retry registry failures here,
          # before they can fail a test suite's beforeAll hook.
          # Keep these tags aligned with test/integration and Testcontainers' Ryuk version.
          images=(pgvector/pgvector:pg15 redis:8.2-alpine redis:7-alpine testcontainers/ryuk:0.14.0)
          for image in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::Failed to pull $image after $attempt attempts"
                exit 1
              fi
              delay=$((attempt * 5))
              echo "::warning::Failed to pull $image (attempt $attempt/5); retrying in ${delay}s"
              sleep "$delay"
            done
          done
      - name: Verify backend
        run: |
          corepack pnpm baseline:check
          corepack pnpm lint
          corepack pnpm typecheck
           corepack pnpm test
           corepack pnpm test:security
           corepack pnpm test:dependency-audit
          corepack pnpm contracts:verify
          corepack pnpm delivery:check
          corepack pnpm openapi:check
          corepack pnpm build
      - name: Build backend image
        run: docker build -t emukey-backend:ci .
      - name: Verify backend runtime image excludes sensitive maintenance files
        run: docker run --rm --entrypoint sh emukey-backend:ci -c "test ! -e /app/.env && test ! -e /app/database/maintenance/drop-all-public-tables.sql && test ! -d /app/contracts"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify frontend
        run: |
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm openapi:check
          corepack pnpm build
      - name: Build frontend image
        run: docker build -t emukey-frontend:ci .

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify mobile
        run: |
          corepack pnpm exec expo install --check
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm openapi:check
          corepack pnpm build
      - name: Build mobile delivery image
        run: docker build -t emukey-mobile:ci .

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.0
      - name: Validate external-database platform model
        # Structural validation uses Compose defaults and does not need runtime secrets.
        run: |
          touch backend/.env
          docker compose --env-file /dev/null config --quiet
      - name: Validate release structure without secrets
        working-directory: backend
        env:
          RELEASE_CHECK_STRUCTURAL_ONLY: 'true'
        # This script uses only Node built-ins; avoid pnpm's automatic install on a clean runner.
        run: node --env-file-if-exists=.env scripts/release-check.mjs

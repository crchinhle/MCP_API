packages: []
# Keep generated Android CMake/codegen paths within Windows toolchain limits.
nodeLinker: hoisted
savePrefix: ''
engineStrict: true
autoInstallPeers: true
strictPeerDependencies: true
strictDepBuilds: true
overrides:
  '@hey-api/json-schema-ref-parser>js-yaml': 4.3.2
minimumReleaseAgeExclude:
  # Explicit Expo SDK patch updates and their required packages, scoped to versions.
  # New releases may be younger than pnpm's default release-age window.
  - '@expo/cli@57.0.23 || 57.0.33'
  - '@expo/metro-file-map@57.0.3'
  - babel-preset-expo@57.0.11 || 57.0.17
  - expo-modules-core@57.0.17 || 57.0.25
  - expo-modules-jsi@57.1.0
  - expo@57.0.21 || 57.0.32
  - '@expo/config-plugins@57.0.12'
  - '@expo/config@57.0.11'
  - '@expo/env@2.4.4'
  - '@expo/fingerprint@0.20.15'
  - '@expo/image-utils@0.11.7'
  - '@expo/inline-modules@0.1.9'
  - '@expo/local-build-cache-provider@57.0.10'
  - '@expo/log-box@57.0.5'
  - '@expo/metro-config@57.0.14'
  - '@expo/plist@0.8.2'
  - '@expo/prebuild-config@57.0.20'
  - '@expo/require-utils@57.0.7'
  - '@expo/router-server@57.0.15'
  - '@expo/schema-utils@57.0.3'
  - expo-asset@57.0.21
  - expo-constants@57.0.23
  - expo-modules-autolinking@57.0.17
  - expo-notifications@57.0.25

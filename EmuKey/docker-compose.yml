name: emukey

services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis-data:/data

  database-initialize:
    profiles: [maintenance]
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/entrypoints/database/initialize.js"]
    env_file:
      - ./backend/.env

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    restart: unless-stopped
    environment: &backend-environment
      PORT: 3000
      REDIS_URL: redis://redis:6379
      EVM_RPC_FALLBACK_HTTP_URL: ${EVM_RPC_FALLBACK_HTTP_URL:-https://ethereum-sepolia-rpc.publicnode.com}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "dist/entrypoints/worker/main.js"]
    env_file:
      - ./backend/.env
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  redis-data:

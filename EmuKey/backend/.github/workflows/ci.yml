name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.21.0
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify source and contracts
        run: |
          corepack pnpm baseline:check
          RELEASE_CHECK_STRUCTURAL_ONLY=true corepack pnpm release:check
          corepack pnpm test:security
          corepack pnpm test:dependency-audit
          corepack pnpm lint
          corepack pnpm typecheck
          corepack pnpm test
          corepack pnpm contracts:verify
          corepack pnpm delivery:check
          corepack pnpm openapi:check
          corepack pnpm build
          git diff --check
      - name: Build standalone image
        run: docker build -t emukey-backend:ci .
      - name: Verify runtime image excludes sensitive maintenance files
        run: docker run --rm --entrypoint sh emukey-backend:ci -c "test ! -e /app/.env && test ! -e /app/database/maintenance/drop-all-public-tables.sql && test ! -d /app/contracts"

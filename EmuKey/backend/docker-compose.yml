name: emukey-backend

services:
  chain:
    profiles: [local-chain]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ['corepack', 'pnpm', '--dir', 'contracts', 'node']
    ports:
      - '127.0.0.1:${EVM_RPC_PORT:-8545}:8545'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8545',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method:'eth_chainId',params:[]})}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend-network

  chain-deploy:
    profiles: [local-chain]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ['corepack', 'pnpm', '--dir', 'contracts', 'deploy:local']
    environment:
      LOCAL_RPC_URL: http://chain:8545
    depends_on:
      chain:
        condition: service_healthy
    networks:
      - backend-network

  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis-data:/data
    networks:
      - backend-network

  database-initialize:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/entrypoints/database/initialize.js']
    env_file:
      - .env
    networks:
      - backend-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:-sepay}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      SEPAY_SANDBOX_CLOCK_OFFSET_SECONDS: ${SEPAY_SANDBOX_CLOCK_OFFSET_SECONDS:-0}
      SEPAY_SANDBOX_RECEIPT_TIMING: ${SEPAY_SANDBOX_RECEIPT_TIMING:-false}
      REDIS_URL: redis://redis:6379
      EVM_RPC_FALLBACK_HTTP_URL: ${EVM_RPC_FALLBACK_HTTP_URL:-https://ethereum-sepolia-rpc.publicnode.com}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '${API_PORT:-3000}:3000'
    networks:
      - backend-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ['node', 'dist/entrypoints/worker/main.js']
    env_file:
      - .env
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      PAYMENT_ADAPTER: ${PAYMENT_ADAPTER:-sepay}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      SEPAY_SANDBOX_CLOCK_OFFSET_SECONDS: ${SEPAY_SANDBOX_CLOCK_OFFSET_SECONDS:-0}
      SEPAY_SANDBOX_RECEIPT_TIMING: ${SEPAY_SANDBOX_RECEIPT_TIMING:-false}
      REDIS_URL: redis://redis:6379
      EVM_RPC_FALLBACK_HTTP_URL: ${EVM_RPC_FALLBACK_HTTP_URL:-https://ethereum-sepolia-rpc.publicnode.com}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  redis-data:

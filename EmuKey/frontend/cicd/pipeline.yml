schemaVersion: 1
component: frontend
container:
  context: .
  dockerfile: Dockerfile
  image: emukey-frontend
ci:
  - corepack pnpm install --frozen-lockfile
  - corepack pnpm lint
  - corepack pnpm typecheck
  - corepack pnpm test
  - corepack pnpm openapi:check
  - corepack pnpm build
cd:
  artifact: oci-image
  port: 80
  buildArguments: [VITE_API_URL]
  healthPath: /
